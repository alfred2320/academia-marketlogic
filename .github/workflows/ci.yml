name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install
      - run: python3 build.py
      - name: public/ y dist/ deben estar compilados y al día
        run: git diff --exit-code -- public dist
      - run: node tests/smoke_artifact.js
      - run: node tests/smoke_pwa.js
      - run: node tests/rls.test.mjs

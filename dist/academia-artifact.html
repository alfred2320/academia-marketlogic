<title>Academia MarketLogic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
--accent:#FF5B09;--accent-h:#FF5225;--ink:#171B26;--surface:#F5F5F5;--border:#E5E7EB;--body:#666;--muted:#6B7280;--light:#CCD6DF;--bg:#fff;--ok:#12805C;--okbg:#E7F5EF;--warnbg:#FFF1E8;--err:#B42318;
--fh:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;--fb:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fh);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
.wrapx{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* barra */
.bar{background:var(--ink);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
.bar-in{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;color:#fff;padding:0}
.brand img{display:block;height:26px;width:auto}
.brand-t{font-family:var(--fh);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border-left:1px solid #3a4152;padding-left:12px}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.tabs button{background:none;border:0;color:var(--light);font-family:var(--fh);font-weight:700;font-size:13px;padding:10px 14px;border-radius:5px;white-space:nowrap}
.tabs button:hover{color:#fff}
.tabs button[aria-current="page"]{color:#fff;box-shadow:inset 0 -3px 0 var(--accent);border-radius:0}
.who{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--light);min-width:0}
.who b{color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:34px;padding:3px 11px;font-family:var(--fh);font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--surface);color:var(--ink);border:1px solid var(--border)}
.pill.or{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:#BFE6D6}
.pill.dk{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding-block:28px 56px;outline:none}
.foot{padding-block:24px 40px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}
/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--accent);background:var(--accent);color:#fff;border-radius:5px;padding:11px 20px;font-family:var(--fh);font-weight:800;font-size:13px;letter-spacing:.02em;text-decoration:none;min-height:44px;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.sm{padding:7px 14px;min-height:36px;font-size:12px}
.btn[disabled]{background:var(--surface);border-color:var(--border);color:var(--muted);cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer}
/* tarjetas */
.card{border:1px solid var(--border);border-radius:16px;background:var(--bg);padding:20px}
.panel{background:var(--surface);border-radius:18px;padding:24px}
.kick{font-family:var(--fh);font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
/* gate */
.gate{min-height:100vh;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;padding-block:40px}
.gate-in{max-width:620px;margin:0 auto;width:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate img{height:32px;width:auto;display:block;margin-bottom:36px}
.gate h1{font-size:clamp(30px,6vw,48px);font-weight:900;line-height:1.05;margin:10px 0 14px}
.gate p{color:var(--light);max-width:52ch}
.gate .fld{margin-top:24px}
.fld label{display:block;font-family:var(--fh);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.inp,.txa,.sel{width:100%;border:2px solid var(--border);border-radius:5px;padding:11px 14px;font:inherit;background:var(--bg);color:var(--ink);min-height:44px}
.inp:focus,.txa:focus,.sel:focus{border-color:var(--accent);outline:none}
.txa{min-height:96px;resize:vertical}
.gate .inp{border-color:#3a4152;background:#1f2432;color:#fff}
.err{color:var(--err);font-weight:600;margin-top:8px}
.gate .err{color:#ff9d7a}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:stretch}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.hero-l{background:var(--ink);color:#fff;border-radius:21px;padding:28px;position:relative;overflow:hidden}
.hero-l h1{font-size:clamp(26px,4.4vw,40px);font-weight:900;line-height:1.08;margin:8px 0 10px}
.hero-l p{color:var(--light);max-width:48ch}
.hero-l .kick{color:var(--accent)}
.ring{display:flex;align-items:center;gap:18px;margin-top:20px;flex-wrap:wrap}
.ring svg{width:92px;height:92px;flex:none}
.ring .num{font-family:var(--fh);font-weight:900;font-size:34px;line-height:1}
.ring small{display:block;color:var(--light);font-size:12px;margin-top:4px}
.blitz{border:2px solid var(--accent);border-radius:21px;padding:22px;background:var(--warnbg);display:flex;flex-direction:column;gap:10px}
.blitz h2{font-size:22px;font-weight:900}
.bar-p{height:10px;background:#fff;border:1px solid #f3c7ad;border-radius:34px;overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--accent);border-radius:34px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.mini{height:6px;background:var(--border);border-radius:34px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent);transition:width .5s}
/* ruta */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 14px;flex-wrap:wrap}
.sec-h h2{font-size:22px;font-weight:800}
.bundle{margin-top:20px}
.bundle-h{display:flex;gap:14px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bundle-h .bn{font-family:var(--fh);font-weight:900;font-size:13px;width:34px;height:34px;border-radius:34px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.bundle.done .bn{background:var(--ok)}
.bundle-h h3{font-size:17px;font-weight:800}
.mod{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--border);border-radius:16px;padding:18px;background:var(--bg);transition:border-color .15s,transform .15s}
.mod:hover{border-color:var(--ink);transform:translateY(-2px)}
.mod .mn{font-family:var(--fh);font-weight:900;font-size:12px;color:var(--accent);letter-spacing:.1em}
.mod h4{font-size:16px;font-weight:800;line-height:1.2}
.mod p{color:var(--body);font-size:13px}
.mod.rec{border:2px solid var(--accent)}
.mod.done{background:var(--okbg);border-color:#BFE6D6}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
/* diagnóstico */
.qopt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--border);background:var(--bg);border-radius:16px;padding:14px 16px;margin-top:10px;transition:border-color .15s,background .15s}
.qopt:hover{border-color:var(--ink)}
.qopt .k{font-family:var(--fh);font-weight:900;width:28px;height:28px;border-radius:28px;background:var(--surface);display:grid;place-items:center;font-size:12px;flex:none}
.qopt.sel{border-color:var(--accent);background:var(--warnbg)}
.qopt.ok{border-color:var(--ok);background:var(--okbg)}
.qopt.ko{border-color:var(--err);background:#FDECEA}
.qopt.ok .k{background:var(--ok);color:#fff}
.qopt.ko .k{background:var(--err);color:#fff}
.qopt[disabled]{cursor:default;opacity:1}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--border)}
.steps i.on{background:var(--accent)}
.steps i.ok{background:var(--ok)}
.steps i.ko{background:var(--err)}
/* lección */
.crumb{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
.mod-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-bottom:22px}
@media(max-width:700px){.mod-h{grid-template-columns:1fr}}
.mod-h h1{font-size:clamp(26px,4vw,38px);font-weight:900;line-height:1.08;margin:6px 0 8px}
.lay{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:860px){.lay{grid-template-columns:1fr}}
.chap{display:flex;flex-direction:column;gap:8px}
.chap button{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--border);border-radius:16px;background:var(--bg);padding:12px 14px}
.chap button:hover{border-color:var(--ink)}
.chap button[aria-current="true"]{border:2px solid var(--accent);background:var(--warnbg)}
.chap .ck{width:26px;height:26px;border-radius:26px;border:2px solid var(--border);display:grid;place-items:center;flex:none;font-size:12px;font-weight:900;font-family:var(--fh)}
.chap .done .ck,.chap button.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.stage{background:var(--ink);color:#fff;border-radius:21px;overflow:hidden;position:relative;min-height:380px;display:flex;flex-direction:column}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px 0;flex-wrap:wrap}
.stage-top .t{font-family:var(--fh);font-weight:700;font-size:12px;color:var(--light);letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;gap:6px;padding:12px 20px 0}
.seg i{flex:1;height:4px;background:#3a4152;border-radius:4px;overflow:hidden;position:relative}
.seg i.on{background:var(--accent)}
.seg i.cur b{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.seg.play i.cur b{animation:fill var(--dur,10s) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.scene{flex:1;padding:26px 24px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:center}
.scene.wide{grid-template-columns:auto minmax(0,1fr);align-items:center;gap:26px}
@media(max-width:560px){.scene.wide{grid-template-columns:1fr}}
.big{font-family:var(--fh);font-weight:900;font-size:clamp(46px,8vw,76px);line-height:.95;color:var(--accent);letter-spacing:-.03em;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.scene .k{animation:up .45s .05s both}
.scene h2{font-size:clamp(22px,3.6vw,32px);font-weight:900;line-height:1.1;animation:up .5s .12s both}
.scene p{color:var(--light);font-size:16px;max-width:54ch;animation:up .5s .22s both}
.scene .kick{color:var(--accent)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.stage-bot{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px 18px;flex-wrap:wrap}
.stage .btn.ghost{color:#fff;border-color:#4a5163}
.stage .btn.ghost:hover{background:#fff;color:var(--ink);border-color:#fff}
.vid{margin-top:14px;border:1px solid var(--border);border-radius:16px;padding:14px 16px;background:var(--surface);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.vid video{width:100%;max-height:420px;border-radius:5px;background:#000;display:block}
@media(prefers-reduced-motion:reduce){.big,.scene .k,.scene h2,.scene p{animation:none}.seg.play i.cur b{animation:none;transform:scaleX(1)}.mod:hover{transform:none}}
/* misiones */
.mis{display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);border-radius:16px;padding:18px;background:var(--bg)}
.mis.lock{background:var(--surface);color:var(--muted)}
.mis.done{border-color:#BFE6D6;background:var(--okbg)}
.mis h4{font-size:16px;font-weight:800}
.cardchips{display:flex;gap:6px;flex-wrap:wrap}
.cc{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ink);border-radius:5px;padding:3px 9px 3px 4px;font-size:12px;background:var(--bg)}
.cc b{font-family:var(--fh);font-weight:900;background:var(--ink);color:#fff;border-radius:3px;padding:1px 6px;font-size:11px}
.cc i{font-style:normal;font-family:var(--fh);font-weight:700;color:var(--muted);font-size:11px}
/* cert */
.reqs{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.reqs li{list-style:none;display:flex;gap:10px;align-items:center}
.reqs ul{padding:0;margin:0}
.reqs .dot{width:22px;height:22px;border-radius:22px;border:2px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:900;flex:none}
.reqs .ok .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.certimg{width:100%;height:auto;border:1px solid var(--border);border-radius:16px;display:block}
/* tabla */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:var(--fh);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:10px 12px;border-bottom:2px solid var(--ink);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.scrollx{overflow-x:auto;border:1px solid var(--border);border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:34px;padding:12px 22px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.banner{background:var(--warnbg);border:1px solid #f3c7ad;border-radius:16px;padding:12px 16px;font-size:13px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--border);border-radius:16px;padding:14px 16px;background:var(--bg)}
.stat b{display:block;font-family:var(--fh);font-weight:900;font-size:28px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.lb li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);list-style:none}
.lb{padding:0;margin:0}
.gate .btn.ghost{color:#fff;border-color:#4a5163}
.gate .btn.ghost:hover{background:#fff;color:var(--ink);border-color:#fff}
.gate .btn[disabled]{background:#2d3446;border-color:#2d3446;color:var(--light)}
.gate p{color:var(--light)}

/* navegacion mejorada */
.tabs{scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.tb{font-style:normal;font-family:var(--fh);font-weight:800;font-size:11px;line-height:1;padding:4px 7px;border-radius:34px;background:#2d3446;color:var(--light)}
.tabs button[aria-current="page"] .tb{background:var(--accent);color:#fff}
.tb.ok{background:var(--ok);color:#fff}
@media(max-width:720px){
 .bar-in{gap:0 12px;padding-block:6px 0}
 .brand-t{display:none}
 .who{margin-left:auto}
 .who b{max-width:120px}
 .tabs{order:3;flex:0 0 100%;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-top:1px solid #2d3446;gap:0}
 .tabs button{flex:1 0 auto;justify-content:center;padding:10px 14px;font-size:12.5px}
}

.tabs .sm{display:none}
@media(max-width:720px){.tabs .lg{display:none}.tabs .sm{display:inline}.tabs button{flex:1 1 0;padding:10px 8px}}
.stage .btn[disabled]{background:transparent;border-color:#3a4152;color:#6b7280}

.ytw{position:relative;width:100%;aspect-ratio:16/9;border-radius:5px;overflow:hidden;background:#000}
.ytw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar-b{color:#fff;border-color:#4a5163}
.bar-b:hover{background:#fff;color:var(--ink);border-color:#fff}
@media(max-width:720px){.bar-b{padding:5px 10px;min-height:32px}}

/* la puerta de acceso ocupa toda la pantalla, sin franja blanca arriba */
main:not(.wrapx){padding:0}

</style>

<div id="app">

 {id:"2.1",t:"Estructura tu día con las 3E",sc:[
  {k:"Hábito",h:"Prospectar es el arte de interrumpir con valor",b:"Creatividad, método y compromiso. Es un juego de números: entender, aprender y optimizar."},
  {k:"Las 3E",h:"Estructura, exploración y explotación",b:"Estructura es tu CRM y tu plan diario. Exploración es la prospección diaria. Explotación es gestionar lo que ya cosechaste: clientes, up y cross selling.",s:"3E"},
  {k:"Exploración",h:"Tus horas sagradas",b:"Bloquea 3 horas al día: primera hora, mediodía y tarde. Trátalas como una reunión con tu mejor cliente, el que estás por conocer.",s:"3 h"},
  {k:"Estructura",h:"CRM sin BEBaS",b:"Basura entra, basura sale. Si alguien leyera tus notas e historial, ¿sabría cómo madurar ese lead? Rol, vertical, objetivo, calificación y canal deben estar completos."}]},
 {id:"2.2",t:"Interrumpir con valor, en varios canales",sc:[
  {k:"Enfoque",h:"Prospecta donde puedes ganar",b:"Define tu perfil de cliente ideal: vertical, subvertical, roles, geografía y tamaño. Tus clientes actuales son la primera referencia."},
  {k:"Teléfono",h:"5 pasos en una llamada",b:"Di su nombre, identifícate, di lo que quieres, crea un puente con un por qué y compromete la respuesta. Haz 25 a 50 dials por hora.",s:"25 a 50"},
  {k:"Email",h:"Asunto de 40 a 50 caracteres",b:"Asunto con intriga, oferta clara, solicitud razonable y valor para el cliente. Corto, relevante y sin adjuntos ni bulk.",s:"40 a 50"},
  {k:"LinkedIn y WhatsApp",h:"Menos de 100 palabras",b:"Simple, sin adjuntos, con una conexión personal y terminando en pregunta. En WhatsApp: identifícate, sé breve y usa enlaces transparentes."}]},
 {id:"2.3",t:"Objeciones y pipeline sano",sc:[
  {k:"Objeciones",h:"Tres claves: ancla, disrumpe, pregunta otra vez",b:"No reacciones por instinto. Responde lo que no esperan y vuelve a preguntar. Si no hay manera, no lo tomes personal y pasa al siguiente."},
  {k:"Pregunta",h:"Asume que vas a ganar",b:"Quien pregunta con confianza y explica el por qué logra su objetivo en el 70% de los casos. Pide menos de lo que ofreces en valor.",s:"70%"},
  {k:"Números",h:"Conoce tu cobertura de pipeline",b:"Con una cuota de $10,000 y 25% de cierre necesitas $40,000 de pipeline. Si cierras 5%, necesitas $200,000.",s:"$40K"},
  {k:"Ley de reemplazo",h:"Lo que prospectas hoy llega en 90 días",b:"La prospección de 30 días trae resultados en los próximos 90. Si hoy no prospectas, lo pagarás después.",s:"30 a 90"}]}
 ],
 q:[
 {q:"¿Qué significan las 3E?",o:["Estructura, exploración y explotación","Estructura, ejecución y exposición","Estrategia, energía y enfoque","Exploración, escalamiento y eficiencia"],a:0,e:"Estructura es tu CRM y plan, exploración la prospección diaria y explotación la gestión de lo ya cosechado."},
 {q:"¿Cuánto tiempo bloqueas al día para tus horas sagradas de prospección?",o:["30 minutos","1 hora","3 horas","6 horas"],a:2,e:"Tres bloques sumando 3 horas: primera hora, mediodía y tarde."},
 {q:"¿Cuántos dials por hora sugiere la sesión en tu bloque de llamadas?",o:["5 a 10","10 a 15","25 a 50","100"],a:2,e:"El volumen es parte del juego de números, siempre con el mensaje de 5 pasos."},
 {q:"¿Qué longitud recomienda la sesión para el asunto de un email de prospección?",o:["10 a 20 caracteres","40 a 50 caracteres","100 a 120 caracteres","Sin límite"],a:1,e:"Un asunto corto con intriga se lee completo, también en móvil."},
 {q:"Según la ley de los 30 días de Blount, ¿qué pasa si hoy no prospectas?",o:["No pasa nada","Lo pagas en algún momento de los próximos 90 días","Lo recuperas mañana sin costo","Mejora tu tasa de cierre"],a:1,e:"La prospección de un período de 30 días da resultados en los próximos 90."},
 {q:"Tu cuota es $10,000 y tu tasa de cierre es 25%. ¿Qué pipeline necesitas?",o:["$25,000","$40,000","$100,000","$200,000"],a:1,e:"10,000 dividido entre 0.25 es 40,000. A mayor tasa de cierre, menos pipeline necesitas."}
 ]},
{id:3,b:"b2",t:"Habilidades para ganar en la era digital",s:"Habilidades",min:60,
 p:"Pitch, brecha de valor, descubrimiento y el perfil del vendedor desafiante.",
 tarea:["Nombra los 5 factores de un buen descubrimiento del estado actual.","Crea tu elevator pitch con lo aprendido.","Escribe qué tipo de vendedor eres y por qué."],
 lessons:[
 {id:"3.1",t:"Elevator pitch, brecha y puente de V.A.L.O.R.",sc:[
  {k:"Pitch",h:"30 segundos que llevan a 5 minutos",b:"Headline, tres beneficios enfocados en el cliente y una evidencia. Prepara tres versiones: 15 segundos, 30 segundos y 1 minuto.",s:"15/30/60"},
  {k:"Pitch",h:"No hables de productos",b:"Demuestra que entiendes su situación con términos como frustración, estrés o paz mental. Endulzantes: sorpresa, intriga, brecha de conocimiento y capacidad única."},
  {k:"Brecha",h:"Del estado actual al estado futuro",b:"En cada venta hay una brecha. Se co-crea con el cliente: su problema de hoy y su aspiración profesional y emocional de mañana."},
  {k:"Puente",h:"V.A.L.O.R.",b:"Ventaja competitiva, Automatización, Limitar residuos, Originalidad y Reducir costos. El puente aparece como resultado natural del descubrimiento."}]},
 {id:"3.2",t:"Descubrimiento: el detector de problemas",sc:[
  {k:"Descubrimiento",h:"Es la enfermedad, no el síntoma",b:"Piensa como doctor: más impacto, más brecha y más valor de tu solución. Los clientes quieren hablar de negocio, no de TI."},
  {k:"Descubrimiento",h:"5 factores del estado actual",b:"Hechos, problemas, impacto, causas y efecto. Agrega las emociones que la situación provoca en el cliente.",s:"5"},
  {k:"Preguntas",h:"Cuatro tipos de preguntas",b:"Investigativas, de proceso, provocativas y confirmatorias. Busca respuestas cuantificables: no “más eficiencia”, sino “15% más de productividad”."},
  {k:"Demo",h:"Sin descubrimiento no hay demo",b:"No mezcles los dos. La demo muestra máximo 6 funciones que resuelven el problema ya entendido.",s:"6"}]},
 {id:"3.3",t:"El vendedor desafiante",sc:[
  {k:"Perfiles",h:"Cinco tipos de vendedor",b:"Fabricante de relaciones, trabajador, lobo solitario, solucionador reactivo y desafiante. En ventas complejas el desafiante exitoso sube de 39% a 54%.",s:"39 a 54%"},
  {k:"Desafiante",h:"Opina con expertise y habla de dinero",b:"Conoce al cliente, ofrece un punto de vista distinto y no necesita su aprobación. El factor decisivo es el valor que genera su expertise."},
  {k:"Cliente",h:"Resiste el cambio",b:"Competimos contra la tranquilidad de lo conocido. Reduce el riesgo y la aversión a la pérdida: se valora 300% más lo que se pierde que lo que se deja de ganar.",s:"300%"},
  {k:"Relación",h:"De proveedor a asesor estratégico",b:"Proveedor es transaccional, consultor es experto y asesor estratégico comparte sus planes contigo. Juega a largo plazo."}]}
 ],
 q:[
 {q:"¿Cuál NO es una de las cinco palancas del puente V.A.L.O.R.?",o:["Reducir costos","Automatización","Limitar residuos","Aumentar descuentos"],a:3,e:"Las cinco son: Ventaja competitiva, Automatización, Limitar residuos, Originalidad y Reducir costos."},
 {q:"¿Cuáles son los 5 factores de un buen descubrimiento del estado actual?",o:["Hechos, problemas, impacto, causas y efecto","Precio, plazo, alcance, riesgo y garantía","Identificar emociones, empatía, influencia, aversión y silencio","Comunicación, procesamiento, feedback, impacto y hechos"],a:0,e:"Parten de los hechos y llegan al efecto sobre el resto de la organización."},
 {q:"¿Cuál es la regla entre descubrimiento y demo?",o:["Primero demo, luego descubrimiento","30 minutos de cada uno","Sin descubrimiento no hay demo y no se mezclan","La demo reemplaza al descubrimiento"],a:2,e:"La demo sin supuestos solo es posible después de entender la necesidad."},
 {q:"En ventas complejas, ¿qué tipo de vendedor suele ganar?",o:["Lobo solitario","Fabricante de relaciones","Solucionador reactivo","Desafiante"],a:3,e:"El desafiante sube su tasa de éxito de 39% a 54% en ventas complejas."},
 {q:"¿Cuánto tarda una persona en evaluar inconscientemente a otra en un primer encuentro?",o:["2 segundos","30 segundos","2 minutos","10 minutos"],a:0,e:"Por eso cámara, fondo y puntualidad cuentan desde el primer segundo."},
 {q:"¿Cuántas características muestra como máximo una demo de una hora?",o:["3","6","12","Todas las del catálogo"],a:1,e:"Seis, enfocadas en el problema del cliente."}
 ]}
];

MODS.push(
{id:4,b:"b3",t:"Negociar cerrando brechas de valor",s:"Negociación",min:60,
 p:"Redefine negociar, descubre problema, necesidad y sentimiento, y toma el control como vendedor desafiante.",
 tarea:["Responde: ¿desde cuándo empieza la negociación?","Escribe dos preguntas para pescar con red.","Escribe una pregunta clave para identificar sentimientos."],
 lessons:[
 {id:"4.1",t:"Negociar no es descontar",sc:[
  {k:"Redefinir",h:"No se trata de descontar al final",b:"Negociar es conducir a ambas partes hacia un objetivo común. Empieza la primera vez que hablas con el cliente y se co-crea con él."},
  {k:"Sandler",h:"Firma tu contrato antes de reunirte",b:"Acuerda objetivo, agenda y tiempo. Pide permiso para preguntar y define que al final ambos decidirán si hay buen fit."},
  {k:"Teoría del juego",h:"Jugadores, estrategia y recompensa",b:"Cada negociación es una partida con decisores. La recompensa es cuantificable, no siempre es dinero. La información fluye todo el tiempo."},
  {k:"Dato",h:"El 93% evita preguntar",b:"En un estudio de Kellogg, el 93% no diagnosticó los objetivos y preocupaciones del otro, aunque hacerlo mejoraba el resultado.",s:"93%"}]},
 {id:"4.2",t:"Problema, necesidad y sentimiento",sc:[
  {k:"Problema",h:"Defínelo, hazlo positivo y conviértelo en pregunta",b:"Describe, sintetiza en una frase, pásalo a positivo y a futuro, y pregúntalo: “¿Cómo podemos mejorar X para estar preparados?”."},
  {k:"Pescar con red",h:"“Cuéntame más sobre...”",b:"Preguntas abiertas que amplían la red. Antes de la siguiente pregunta, resume lo que oíste para que el cliente valide o corrija."},
  {k:"Necesidad",h:"Aspiraciones, no mínimos",b:"Sepáralas en tangibles e intangibles. Pregunta por qué importan y cuida que no se vuelvan exigencias. Son dinámicas: repite el ejercicio."},
  {k:"Sentimiento",h:"La temperatura del campo de juego",b:"Los sentimientos son hechos y son accionables. Pregunta “¿qué te preocupa de la situación actual?” y disfruta el silencio."}]},
 {id:"4.3",t:"El vendedor desafiante toma el control",sc:[
  {k:"Experiencia de compra",h:"Lo que el cliente percibe como valor",b:"Perspectivas originales, ayuda para navegar alternativas, evitar campos minados y una compra sencilla. Tus competidores también invierten en mejorar."},
  {k:"3 principios",h:"Enseñar, personalizar, controlar",b:"Reformula cómo el cliente ve el problema, habla desde su contexto y maneja su aversión al riesgo siendo directo, nunca agresivo."},
  {k:"Control",h:"Cómodo con el dinero, creando momentum",b:"Se mantiene en su propuesta de valor, anticipa el siguiente paso y crea urgencia. Asertivo, ni pasivo ni agresivo."},
  {k:"Plataforma",h:"Prepara tu plataforma de negociación",b:"Pros y contras a ojos del cliente, qué preguntar, qué compartir y qué cuidar, concesiones a dar y a pedir, y tu número."}]}
 ],
 q:[
 {q:"¿Desde cuándo empieza la negociación?",o:["Cuando el cliente firma","Desde la primera vez que hablamos con el cliente","Desde la quinta conversación","Cuando se habla de precio"],a:1,e:"No esperas al final del contrato: cada reunión suma información para conducir mejor."},
 {q:"¿Qué es una pregunta para “pescar con red”?",o:["Una pregunta cerrada de sí o no","Una pregunta abierta como “cuéntame sobre...” que amplía lo que sabes","Una oferta con descuento","Una pregunta sobre el presupuesto"],a:1,e:"La red recoge más que la caña: abre objetivo, perspectiva y ángulos que no habías previsto."},
 {q:"Antes de pasar a la siguiente pregunta, ¿qué haces?",o:["Cambias de tema","Resumes lo conversado para que el cliente valide o corrija","Mandas la propuesta","Das tu opinión"],a:1,e:"Escuchar activamente es sintetizar y repetir."},
 {q:"¿Cuál NO es uno de los 3 principios del vendedor desafiante?",o:["Enseñanza comercial","Personalización con resonancia","Control de la venta","Descuento anticipado"],a:3,e:"Enseña, personaliza y controla. El descuento anticipado regala valor."},
 {q:"¿Qué haces cuando detectas que el cliente no es compatible?",o:["Insistes hasta cerrar","Diseñas el puente para que otro lo construya más barato","Agradeces y proteges el tiempo de ambas partes","Bajas el precio"],a:2,e:"Saber salirse de una oportunidad es valioso para ambos."},
 {q:"En la plataforma de negociación, ¿qué incluyes?",o:["Solo tu precio","Información a pedir y cuidar, necesidades de ambos, concesiones a dar y pedir, y tu número","Solo la lista de competidores","La lista de descuentos"],a:1,e:"Prepararla evita improvisar y te permite conceder según un plan."}
 ]},
{id:5,b:"b3",t:"Cierre y posventa en la era digital",s:"Cierre y posventa",min:60,
 p:"Los 5 factores para controlar la venta, hablar de dinero, mantener el momentum y crecer la cuenta con referidos.",
 tarea:["Escribe los 5 factores para controlar la venta desde el principio.","Crea 3 preguntas para tu plataforma de negociación.","Escribe 3 hábitos que pondrás en práctica."],
 lessons:[
 {id:"5.1",t:"Controla la venta desde el principio",sc:[
  {k:"5 factores",h:"Pescar, proponer, decidir, plataforma, empatía",b:"Pescar con red, presentación de propuesta, entender el proceso de decisión, plataforma de negociación y empatía táctica y recíproca.",s:"5"},
  {k:"Harvard",h:"4 principios ganar-ganar",b:"Separa a la persona de la situación, negocia desde intereses y no posiciones, desarrolla requisitos de la solución y ofrece opciones."},
  {k:"Proceso de decisión",h:"¿Quién, cómo, dónde, qué, por qué ahora, cuándo?",b:"En B2B complejo debes conocer a todos los decisores. Si el criterio no coincide con el descubrimiento, di: “Estoy confundido. Tú dijiste...”."},
  {k:"Propuesta",h:"Contrato previo y un dolor a la vez",b:"Acuerda agenda y formato, presenta primero el dolor más importante y confirma que lo resuelve antes de pasar al siguiente."}]},
 {id:"5.2",t:"Hablar de dinero sin regalar valor",sc:[
  {k:"Empatía",h:"“Suena como que...”",b:"Resume su situación sin afirmar al 100%. Si responde “Eso es...”, vas bien. Espeja 2 o 3 palabras clave y sonríe: suena 31% más positivo.",s:"31%"},
  {k:"Movidas",h:"Cada concesión es recíproca",b:"Si es fácil dar el descuento, ¿era costosa la propuesta original? Pregunta qué piensa lograr con ese descuento y qué necesita realmente."},
  {k:"Objeción de precio",h:"Recuerda el valor del estado futuro",b:"“Estoy confundido... si esta solución te trae XX, ¿por qué no pagar YY?”. Si es un tema de asignación, calcula el costo de demorar."},
  {k:"Presupuesto",h:"Bracketing, casos y experiencia pasada",b:"“Cuesta entre X y Z, ¿encaja?”. Comparte casos alto, medio y bajo, y confirma que la persona tiene autoridad y presupuesto."}]},
 {id:"5.3",t:"Momentum, posventa y referidos",sc:[
  {k:"Trials",h:"Solo si y solo si",b:"El cliente paga alguna instalación, define criterios de éxito medibles y se compromete a comprar al cumplirlos. Se divide el riesgo."},
  {k:"Momentum",h:"El prospecto desaparece",b:"Acciona, no reacciones. Recuérdale estado actual y futuro, di que te sorprende el silencio y pregunta si algo cambió."},
  {k:"Posventa",h:"Onboarding, up-selling y cross-selling",b:"Cross-selling es nuevos departamentos o geografías. Up-selling es servicios adicionales. Pide permiso, referencia casos y pide feedback."},
  {k:"Referidos",h:"Cena con referido y referente cierra más",b:"Por email cierra 50%. Un almuerzo con referido y referente cierra 80 a 90%. Cada conversación de referido lleva a 2 nuevas.",s:"80 a 90%"}]}
 ],
 q:[
 {q:"¿Cuáles son los 5 factores para controlar la venta desde el principio?",o:["Pescar con red, presentación de propuesta, proceso de decisión, plataforma de negociación y empatía táctica y recíproca","Saludar, pescar, no entender la decisión, plataforma y empatía","Pescar con red, preguntar presupuesto, proponer, entender y empatía","Descuento, urgencia, escasez, cierre y firma"],a:0,e:"Son las cinco palancas de la sesión. Se aplican desde la primera reunión."},
 {q:"Si el criterio de decisión del cliente no coincide con el descubrimiento, ¿qué dices?",o:["Yo pensé que...","Estoy confundido. Tú dijiste...","Eso no es lo que habíamos acordado","Entonces bajo el precio"],a:1,e:"“Yo pensé” te hace ver como responsable del error. “Tú dijiste” protege al cliente y expone la inconsistencia."},
 {q:"El cliente pide descuento. ¿Qué haces primero?",o:["Lo das para avanzar","Preguntas qué piensa lograr con ese descuento","Cuelgas","Subes el precio"],a:1,e:"Entiendes qué necesita y quizás lo resuelves de otra forma."},
 {q:"¿Qué es el bracketing?",o:["Dar un rango: “cuesta entre X y Z, ¿encaja con tu presupuesto?”","Subir el precio por tramos","Ofrecer tres descuentos","Pedir un adelanto"],a:0,e:"Es una forma de determinar el presupuesto sin mostrar un precio único."},
 {q:"¿Cuándo aceptas un trial?",o:["Siempre, para ganar tiempo","Solo si el cliente paga instalación, define métricas y se compromete a comprar","Cuando el cliente lo pide una vez","Nunca"],a:1,e:"Si y solo si. Forzar la conversación se percibe como síntoma de calidad."},
 {q:"¿Qué cierra más: referido por email o almuerzo con referido y referente?",o:["Email, 90%","Email 50% y almuerzo 80 a 90%","Ambos igual","Ninguno funciona"],a:1,e:"El encuentro cara a cara cierra mucho más. Lo pide quien tiene mejor relación con el cliente."}
 ]},
{id:6,b:"b4",t:"Hábitos de comportamiento y performance",s:"Hábitos",min:55,
 p:"Qué espera tu equipo de un gerente, cómo medir con objetivos SMART y cómo construir hábitos y tu historia de marca.",
 tarea:["Elige 3 hábitos y su señal, acción y premio.","Escribe un objetivo SMART a 30, 60 y 90 días.","Redacta tu brand story en 7 pasos."],
 lessons:[
 {id:"6.1",t:"Gerente, coaching y objetivos SMART",sc:[
  {k:"Investigación",h:"Qué espera el equipo de su gerente",b:"Según Dixon y Adamson: 73.4% son factores funcionales (vendedor desafiante, coaching, gestión) y 26.6% culturales.",s:"73%"},
  {k:"Coaching",h:"70, 20, 10",b:"70% se aprende en la experiencia diaria, 20% en interacciones y 10% en eventos formales. El 94% quiere aprender de colegas más senior.",s:"70/20/10"},
  {k:"Gerente",h:"Prioriza clientes con Pareto",b:"El 80% de los efectos viene del 20% de las causas. Decide con números e intuición educada: la historia detrás de cada número lo ancla."},
  {k:"SMART",h:"Específico, medible, alcanzable, relevante, con fecha",b:"Define hitos a 30, 60 y 90 días con 1:1 y reuniones de equipo. Si no lo puedes medir, no lo puedes mejorar."}]},
 {id:"6.2",t:"Crear hábitos que se sostienen",sc:[
  {k:"Hábito",h:"Señal, acción y premio",b:"Veo el teléfono, prospecto, gano dinero. La autodisciplina es automatizar hábitos, como tu rutina de la mañana."},
  {k:"Tiempo",h:"En promedio 66 días",b:"Puede tomar entre 18 y 254 días según el estudio de University College London. La constancia pesa más que la intensidad.",s:"66 d"},
  {k:"Fundamentales",h:"Pocos, de alto impacto y con tu por qué",b:"Elige hábitos selectivos que coincidan con tus fortalezas. Crea tu brecha personal: ambiciosa pero accesible."},
  {k:"Visualización",h:"Visualiza el proceso, no el resultado",b:"Imaginar el resultado da dopamina sin acción. Visualiza cada acción de tu día para entrenar tu mente."}]},
 {id:"6.3",t:"Cultura y la historia de tu marca",sc:[
  {k:"Cultura",h:"Lo que hacemos cuando nadie nos mira",b:"Integridad, confiabilidad y saber escuchar. Revisar el pipeline no es un dolor, es un ejercicio para construir confianza."},
  {k:"Dato",h:"53% de la lealtad viene de la experiencia de ventas",b:"El equipo debe confiar en la evidencia detrás de sus números. Las cuotas se construyen desde la información del vendedor.",s:"53%"},
  {k:"Brand story",h:"El cliente es el héroe, tú eres la guía",b:"Personaje con una brecha, un problema (villano externo, interno y filosófico), una guía con empatía y autoridad, un plan, una llamada a la acción, evitar el fracaso y un éxito."},
  {k:"Plan",h:"Del equipo del cliente al post-venta",b:"Reunión, co-definición del problema, co-creación del puente, propuesta, demo, trial, contrato y posventa. Siempre un próximo paso."}]}
 ],
 q:[
 {q:"¿Qué porcentaje de las expectativas del equipo hacia su gerente son factores funcionales?",o:["26.6%","50%","73.4%","90%"],a:2,e:"El 73.4% son funcionales y el 26.6% culturales."},
 {q:"¿Cómo se reparte el aprendizaje 70, 20, 10?",o:["70% eventos formales","70% experiencias diarias, 20% interacciones, 10% eventos formales","70% teoría","Todo en cursos"],a:1,e:"El aprendizaje vive en el trabajo diario, por eso el coaching constante importa."},
 {q:"¿Cuál es el ciclo de un hábito?",o:["Meta, plan, castigo","Señal, acción y premio","Idea, queja, olvido","Reunión, informe, auditoría"],a:1,e:"Ejemplo: veo el teléfono, prospecto, gano dinero."},
 {q:"¿Qué debes visualizar para sostener un hábito?",o:["Solo el resultado final","El proceso de tu día y cada acción positiva","Nada","El premio en efectivo"],a:1,e:"Visualizar solo el resultado da dopamina sin haber hecho nada."},
 {q:"En la historia de tu marca, ¿quién es el héroe?",o:["Tu empresa","Tu producto","El cliente","El vendedor"],a:2,e:"El cliente es el héroe de su propia historia y tú eres la guía."},
 {q:"¿Cuántos días tarda en promedio formar un hábito?",o:["7","21","66","365"],a:2,e:"En promedio 66, con un rango de 18 a 254 días."}
 ]},
{id:7,b:"b4",t:"Construye tu roadmap",s:"Roadmap",min:50,
 p:"Cierra la ruta: perfil, día en 3E, pitch, detector de problemas, desafiante y métricas en tu roadmap 30-60-90.",
 tarea:["Completa tu roadmap con las 4 etapas.","Comparte tu plataforma de negociación.","Define tus métricas y tu primer BLITZ."],
 lessons:[
 {id:"7.1",t:"Etapas 1 y 2: perfil y pipeline",sc:[
  {k:"Etapa 1",h:"Perfil que posiciona, no CV en línea",b:"Foto profesional, headline en 2 líneas, historia, recomendaciones y métricas: vistas del perfil, interacción y crecimiento de conexiones."},
